name: gateway-wf
on:
  push:
    branches:
      - "main"
    paths:
      - "gateway/**"
      - ".github/workflows/gateway-**"
      - ".github/workflows/tests.yaml"
  pull_request:
    branches:
      - "*"
    paths:
      - "gateway/**"
      - ".github/workflows/gateway-**"
      - ".github/workflows/tests.yaml"

env:
  PYTHON_VERSION: "3.11"
  UV_VERSION: "0.7.13"
  IMAGES_TAG: main
  # Dependency-Track project names (registry-independent, stable across builds)
  GATEWAY_PYTHON_PROJECT: radicalbit-ai-gateway-python
  UI_PROJECT: radicalbit-ai-gateway-ui

jobs:
  test:
    uses: ./.github/workflows/tests.yaml
    with:
      working-directory: ./gateway
      run-pytest: true

  pipeline:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/gateway-pipeline.yaml
    with:
      image-tag: main
    secrets: inherit

  source-sbom:
    runs-on: ubuntu-22.04
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python source SBOM → Dependency-Track (gateway)
        uses: ./.github/actions/python-sbom-dependency-track
        with:
          working-directory: ./gateway
          python-version: ${{ env.PYTHON_VERSION }}
          uv-version: ${{ env.UV_VERSION }}
          project-name: ${{ env.GATEWAY_PYTHON_PROJECT }}
          project-version: ${{ env.IMAGES_TAG }}
          is-latest: "false"
          project-tags: oss,python,source
          dt-url: ${{ secrets.DEPENDENCYTRACK_URL }}
          dt-api-key: ${{ secrets.DEPENDENCYTRACK_API_KEY }}
      - name: UI source SBOM → Dependency-Track
        uses: ./.github/actions/ui-sbom-dependency-track
        with:
          working-directory: ./ui
          project-name: ${{ env.UI_PROJECT }}
          project-version: ${{ env.IMAGES_TAG }}
          is-latest: "false"
          project-tags: oss,npm,source
          dt-url: ${{ secrets.DEPENDENCYTRACK_URL }}
          dt-api-key: ${{ secrets.DEPENDENCYTRACK_API_KEY }}
