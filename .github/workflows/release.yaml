name: release
on:
  release:
    types: [published]

concurrency:
  group: docker-tag-${{ github.event.release.tag_name }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  UV_VERSION: "0.7.13"
  # Dependency-Track project names (registry-independent, stable across builds)
  GATEWAY_PYTHON_PROJECT: radicalbit-ai-gateway-python
  WORKER_PYTHON_PROJECT: metrics-worker-python
  UI_PROJECT: radicalbit-ai-gateway-ui

jobs:
  prep:
    runs-on: ubuntu-22.04
    outputs:
      is_semver: ${{ steps.check.outputs.is_semver }}
      is_final: ${{ steps.check.outputs.is_final }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Set version/tag
        id: check
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "is_semver=$(if [[ "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-.*)?$ ]]; then echo 'true'; else echo 'false'; fi)" >> "$GITHUB_OUTPUT"
          echo "is_final=$(if [[ "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo 'true'; else echo 'false'; fi)" >> "$GITHUB_OUTPUT"

  test-gateway:
    uses: ./.github/workflows/tests.yaml
    with:
      working-directory: ./gateway
      run-pytest: true

  test-worker:
    uses: ./.github/workflows/tests.yaml
    with:
      working-directory: ./metrics-worker
      run-pytest: false

  publish-pypi:
    runs-on: ubuntu-22.04
    needs: [prep, test-gateway]
    if: needs.prep.outputs.is_semver == 'true'
    permissions:
      contents: read # needed by actions/checkout
      id-token: write # needed for PyPI trusted publishing (OIDC)
    defaults:
      run:
        working-directory: ./gateway
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags, required by setuptools-scm
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Setup uv
        run: |
          curl -LsSf https://astral.sh/uv/${{ env.UV_VERSION }}/install.sh | sh
      - name: Build package
        run: |
          uv build
      - name: Publish to PyPI
        run: |
          uv publish --trusted-publishing always

  gateway-images:
    needs: [prep, test-gateway, test-worker]
    uses: ./.github/workflows/gateway-pipeline.yaml
    with:
      image-tag: ${{ needs.prep.outputs.version }}
      push-latest: ${{ needs.prep.outputs.is_final == 'true' }}
    secrets: inherit

  worker-images:
    needs: [prep, test-gateway, test-worker]
    uses: ./.github/workflows/worker-pipeline.yaml
    with:
      image-tag: ${{ needs.prep.outputs.version }}
      push-latest: ${{ needs.prep.outputs.is_final == 'true' }}
    secrets: inherit

  source-sbom:
    runs-on: ubuntu-22.04
    needs: prep
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python source SBOM → Dependency-Track (gateway)
        uses: ./.github/actions/python-sbom-dependency-track
        with:
          working-directory: ./gateway
          python-version: ${{ env.PYTHON_VERSION }}
          uv-version: ${{ env.UV_VERSION }}
          project-name: ${{ env.GATEWAY_PYTHON_PROJECT }}
          project-version: ${{ needs.prep.outputs.version }}
          is-latest: ${{ needs.prep.outputs.is_final }}
          project-tags: oss,python,source
          dt-url: ${{ secrets.DEPENDENCYTRACK_URL }}
          dt-api-key: ${{ secrets.DEPENDENCYTRACK_API_KEY }}
      - name: UI source SBOM → Dependency-Track
        uses: ./.github/actions/ui-sbom-dependency-track
        with:
          working-directory: ./ui
          project-name: ${{ env.UI_PROJECT }}
          project-version: ${{ needs.prep.outputs.version }}
          is-latest: ${{ needs.prep.outputs.is_final }}
          project-tags: oss,npm,source
          dt-url: ${{ secrets.DEPENDENCYTRACK_URL }}
          dt-api-key: ${{ secrets.DEPENDENCYTRACK_API_KEY }}
      - name: Python source SBOM → Dependency-Track (metrics-worker)
        uses: ./.github/actions/python-sbom-dependency-track
        with:
          working-directory: ./metrics-worker
          python-version: ${{ env.PYTHON_VERSION }}
          uv-version: ${{ env.UV_VERSION }}
          project-name: ${{ env.WORKER_PYTHON_PROJECT }}
          project-version: ${{ needs.prep.outputs.version }}
          is-latest: ${{ needs.prep.outputs.is_final }}
          project-tags: oss,python,source
          dt-url: ${{ secrets.DEPENDENCYTRACK_URL }}
          dt-api-key: ${{ secrets.DEPENDENCYTRACK_API_KEY }}
