<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2477FF"/>
      <stop offset="100%" stop-color="#0040CC"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0033AA" flood-opacity="0.38"/>
    </filter>
  </defs>
  <rect x="2" y="2" width="276" height="56" rx="11" fill="url(#g)" filter="url(#sh)"/>
  <g transform="translate(59, 18)">
    <!-- Calendar icon -->
    <rect x="0" y="3" width="20" height="18" rx="2.5" fill="none" stroke="white" stroke-width="1.6"/>
    <line x1="0" y1="9" x2="20" y2="9" stroke="white" stroke-width="1.6"/>
    <line x1="6" y1="0" x2="6" y2="6" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="14" y1="0" x2="14" y2="6" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
    <rect x="2.5" y="12" width="3.5" height="3.5" rx="0.8" fill="white" opacity="0.85"/>
    <rect x="8.25" y="12" width="3.5" height="3.5" rx="0.8" fill="white" opacity="0.85"/>
    <rect x="14" y="12" width="3.5" height="3.5" rx="0.8" fill="white" opacity="0.85"/>
    <!-- Label -->
    <text x="32" y="17"
          font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
          font-size="16" font-weight="700" fill="white" letter-spacing="0.2">Book a Demo</text>
    <!-- Arrow -->
    <text x="148" y="17"
          font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
          font-size="16" font-weight="400" fill="white" opacity="0.85">→</text>
  </g>
</svg>
