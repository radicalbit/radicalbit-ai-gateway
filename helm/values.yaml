image:
  tag: latest
  pullPolicy: IfNotPresent
  pullSecrets: [ ]

nameOverride: ""
fullnameOverride: ""

commonLabels: {}
commonAnnotations: {}

postgresql:
  host: postgres
  port: 5432
  database: gateway
  schema: default
  auth:
    username:
      value: ""
      existingSecret:
      existingSecretKey: username
    password:
      value: ""
      existingSecret:
      existingSecretKey: password

clickhouse:
  host: clickhouse
  port: 9000
  nativeProtocolPort: 8123
  database: default
  auth:
    username:
      value: ""
      existingSecret:
      existingSecretKey: username
    password:
      value: ""
      existingSecret:
      existingSecretKey: password

valkey:
  host: valkey
  port: 6379

otelCollector:
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: 0.143.1

gateway:
  image:
    repository: radicalbit/radicalbit-ai-gateway
  replicaCount: 1
  resources: {}
  service:
    ports:
      api: 9000
      metrics: 8001
  ingress:
    enabled: false
    annotations: {}
    ingressClassName:
    path: /
    pathType: Prefix
    hosts:
      - chart-example.local
    tls: []
    #  - secretName: chart-example-tls
    #    hosts:
    #      - chart-example.local
  plugins: ""
  # Env vars for plugins only: gateway settings have their own values below.
  extraEnvVars: []
  debugMode: false
  # plain, json or color
  logMode: plain
  workers:
    uvicorn: ""
  # Browser origins allowed to call the API. Empty keeps the gateway default
  # (http://localhost:5173); allowCredentials null keeps the default, true.
  cors:
    allowOrigins: []
    allowCredentials: null
  # Event pipeline to the metrics worker. Empty keeps the gateway defaults
  # (batch 50, flush 100 ms, broker pool 5).
  events:
    batchSize: ""
    flushMs: ""
    brokerPoolLimit: ""
  secrets:
    fromSecret: true
    externalSecret: gateway-secrets
    externalSecretKey: secrets.yaml
    plainSecrets: {}
  tracing:
    otlpExporters:
  prompts:
    enabled: false
    fromConfigMap: false
    externalConfigMap: ""
    source: "prompts"
    mountPath: "/radicalbit_ai_gateway/radicalbit_ai_gateway/prompts"
  judgePrompts:
    enabled: false
    fromConfigMap: false
    externalConfigMap: ""
    source: "custom-prompts"
    mountPath: "/radicalbit_ai_gateway/radicalbit_ai_gateway/guardrails/judges/custom-prompts"
  alerts:
    thresholdPercentages: "[75, 98]"
    windowTickSeconds: 30
    # SMTP server the gateway sends alert emails through. An empty host keeps
    # the gateway default, localhost.
    smtp:
      host: ""
      port: 25
      user: ""
      fromEmail: "alerts@radicalbit.ai"
      maxWorkers: 4
      # Set either value (the chart stores it in a Secret) or existingSecret.
      # With neither, no password is sent.
      password:
        value: ""
        existingSecret: ""
        existingSecretKey: password
  # AI config generator. Empty baseUrl, model and maxRetries keep the gateway
  # defaults (OpenAI, gpt-4.1, 3).
  assistant:
    apiKey:
      value: ""
      existingSecret: assistant-key
      existingSecretKey: apiKey
    baseUrl: ""
    model: ""
    maxRetries: ""
  migrations:
    image:
      repository: radicalbit/radicalbit-ai-gateway-migrations
  metrics:
    enabled: true
    interval: 30s
    scrapeTimeout: 25s

metricsWorker:
  image:
    repository: radicalbit/radicalbit-ai-gateway-metrics-worker
  replicaCount: 1
  resources: {}
  # Empty or null keeps the worker defaults: log level INFO, async insert on
  # without waiting, prefetch 4, batch 200, flush every 500 ms.
  logLevel: ""
  clickhouse:
    asyncInsert: null
    waitForAsync: null
  metrics:
    prefetch: ""
    batchSize: ""
    flushIntervalMs: ""
  migrations:
    image:
      repository: radicalbit/radicalbit-ai-gateway-clickhouse-migrations
