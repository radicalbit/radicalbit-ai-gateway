apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "worker.fullname" . }}
  labels:
    {{- include "worker.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.metricsWorker.replicaCount }}
  selector:
    matchLabels:
      {{- include "worker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "worker.labels" . | nindent 8 }}
    spec:
      {{- if .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range .Values.image.pullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      initContainers:
        - name: database-migrations
          image: "{{ .Values.metricsWorker.migrations.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  {{- if .Values.clickhouse.auth.username.existingSecretKey }}
                  key: {{ .Values.clickhouse.auth.username.existingSecretKey }}
                  {{- else }}
                  key: username
                  {{- end }}
                  {{- if .Values.clickhouse.auth.username.existingSecret }}
                  name: {{ .Values.clickhouse.auth.username.existingSecret }}
                  {{- else }}
                  name: {{ include "common.fullname" . }}-ch-auth
                  {{- end }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- if .Values.clickhouse.auth.password.existingSecretKey }}
                  key: {{ .Values.clickhouse.auth.password.existingSecretKey }}
                  {{- else }}
                  key: password
                  {{- end }}
                  {{- if .Values.clickhouse.auth.password.existingSecret }}
                  name: {{ .Values.clickhouse.auth.password.existingSecret }}
                  {{- else }}
                  name: {{ include "common.fullname" . }}-ch-auth
                  {{- end }}
            - name: GOOSE_DRIVER
              value: clickhouse
            - name: GOOSE_DBSTRING
              value: "tcp://$(CLICKHOUSE_USER):$(CLICKHOUSE_PASSWORD)@{{ .Values.clickhouse.host }}:{{ .Values.clickhouse.port }}/{{ .Values.clickhouse.database }}"
      containers:
        - name: metrics-worker
          image: "{{ .Values.metricsWorker.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.metricsWorker.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: CELERY_BROKER_URL
              value: redis://{{ .Values.valkey.host }}:{{ .Values.valkey.port }}/0
            - name: CLICKHOUSE_HOST
              value: {{ .Values.clickhouse.host }}
            - name: CLICKHOUSE_PORT
              value: {{ .Values.clickhouse.nativeProtocolPort | quote }}
            - name: CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  {{- if .Values.clickhouse.auth.username.existingSecretKey }}
                  key: {{ .Values.clickhouse.auth.username.existingSecretKey }}
                  {{- else }}
                  key: username
                  {{- end }}
                  {{- if .Values.clickhouse.auth.username.existingSecret }}
                  name: {{ .Values.clickhouse.auth.username.existingSecret }}
                  {{- else }}
                  name: {{ include "common.fullname" . }}-ch-auth
                  {{- end }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- if .Values.clickhouse.auth.password.existingSecretKey }}
                  key: {{ .Values.clickhouse.auth.password.existingSecretKey }}
                  {{- else }}
                  key: password
                  {{- end }}
                  {{- if .Values.clickhouse.auth.password.existingSecret }}
                  name: {{ .Values.clickhouse.auth.password.existingSecret }}
                  {{- else }}
                  name: {{ include "common.fullname" . }}-ch-auth
                  {{- end }}
            - name: CLICKHOUSE_DATABASE
              value: {{ .Values.clickhouse.database | quote }}
            {{- with .Values.metricsWorker.clickhouse }}
            {{- if not (kindIs "invalid" .asyncInsert) }}
            - name: CLICKHOUSE_ASYNC_INSERT
              value: {{ .asyncInsert | quote }}
            {{- end }}
            {{- if not (kindIs "invalid" .waitForAsync) }}
            - name: CLICKHOUSE_WAIT_FOR_ASYNC
              value: {{ .waitForAsync | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.metricsWorker.metrics }}
            {{- if .prefetch }}
            - name: METRICS_WORKER_PREFETCH
              value: {{ .prefetch | quote }}
            {{- end }}
            {{- if .batchSize }}
            - name: METRICS_BATCH_SIZE
              value: {{ .batchSize | quote }}
            {{- end }}
            {{- if .flushIntervalMs }}
            - name: METRICS_FLUSH_INTERVAL_MS
              value: {{ .flushIntervalMs | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.metricsWorker.logLevel }}
            - name: LOG_LEVEL
              value: {{ . | quote }}
            {{- end }}
          {{- with .Values.metricsWorker.resources }}
          resources:
{{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.metricsWorker.livenessProbe }}
          livenessProbe:
{{ toYaml . | indent 12 }}
          {{- end }}
          {{- with .Values.metricsWorker.readinessProbe }}
          readinessProbe:
{{ toYaml . | indent 12 }}
          {{- end }}
      {{- with .Values.metricsWorker.nodeSelector }}
      nodeSelector:
{{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.metricsWorker.affinity }}
      affinity:
{{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.metricsWorker.tolerations }}
      tolerations:
{{- toYaml . | nindent 8 }}
      {{- end }}