{{- with .Values.gateway.alerts.smtp.password }}
{{- if and .value (not .existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gateway.fullname" $ }}-smtp
  labels:
    {{- include "gateway.labels" $ | nindent 4 }}
type: Opaque
data:
  password: {{ .value | b64enc | quote }}
{{- end }}
{{- end }}
