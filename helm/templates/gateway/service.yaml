apiVersion: v1
kind: Service
metadata:
  name: {{ template "gateway.fullname" . }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "gateway.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.gateway.service.ports.api }}
      targetPort: http
    - name: metrics
      protocol: TCP
      port: {{ .Values.gateway.service.ports.metrics }}
      targetPort: metrics