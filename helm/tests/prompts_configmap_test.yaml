suite: test prompts-configmap.yaml manifest
templates:
  - gateway/prompts-configmap.yaml
tests:
  - it: should not create the ConfigMap when prompts are disabled
    set:
      gateway:
        prompts:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0
  - it: should create the ConfigMap when prompts are enabled and fromConfigMap is false
    set:
      gateway:
        prompts:
          enabled: true
          fromConfigMap: false
          source: "tests/fixtures/prompts"
          mountPath: "/app/prompts"
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - isAPIVersion:
          of: v1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-radicalbit-ai-gateway-gw-prompts
  - it: should not create the ConfigMap when fromConfigMap is true
    set:
      gateway:
        prompts:
          enabled: true
          fromConfigMap: true
          externalConfigMap: "my-prompts-configmap"
          source: "tests/fixtures/prompts"
          mountPath: "/app/prompts"
    asserts:
      - hasDocuments:
          count: 0
