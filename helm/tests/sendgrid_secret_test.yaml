suite: test sendgrid-secret.yaml manifest
templates:
  - commons/sendgrid-secret.yaml
tests:
  - it: should not create the manifest when using existing secret
    set:
      metricsWorker:
        notifications:
          sendgrid:
            enabled: true
            apiKey:
              existingSecret: "my-sendgrid-secret"
    asserts:
      - hasDocuments:
          count: 0
  - it: should not create the manifest when SendGrid is disabled
    set:
      metricsWorker:
        notifications:
          sendgrid:
            enabled: false
            apiKey:
              value: "SG.test-api-key"
    asserts:
      - hasDocuments:
          count: 0
  - it: should create the manifest when apiKey value is provided and SendGrid is enabled
    set:
      metricsWorker:
        notifications:
          sendgrid:
            enabled: true
            apiKey:
              value: "SG.test-api-key"
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - isAPIVersion:
          of: v1
      - isNotEmpty:
          path: data.sendgrid-api-key
