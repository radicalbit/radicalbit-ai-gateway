suite: test clickhouse-auth-secret.yaml manifest
templates:
  - commons/clickhouse-auth-secret.yaml
tests:
  - it: should not create the manifest if not needed
    set:
      clickhouse:
        auth:
          username:
            existingSecret: "secret"
          password:
            existingSecret: "secret"
    asserts:
      - hasDocuments:
          count: 0
  - it: should create the manifest if username is provided
    set:
      clickhouse:
        auth:
          username:
            value: "admin"
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - isAPIVersion:
          of: v1
      - isNotEmpty:
          path: data.username
  - it: should create the manifest if password is provided
    set:
      clickhouse:
        auth:
          password:
            value: "admin"
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - isAPIVersion:
          of: v1
      - isNotEmpty:
          path: data.password