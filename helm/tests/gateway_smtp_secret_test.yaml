suite: test gateway-smtp-secret.yaml manifest
templates:
  - gateway/gateway-smtp-secret.yaml
tests:
  - it: should not create the manifest without a password
    asserts:
      - hasDocuments:
          count: 0
  - it: should not create the manifest when the password is in an existing secret
    set:
      gateway:
        alerts:
          smtp:
            password:
              value: hunter2
              existingSecret: my-smtp
    asserts:
      - hasDocuments:
          count: 0
  - it: should create the manifest when a password is given
    set:
      gateway:
        alerts:
          smtp:
            password:
              value: hunter2
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: data.password
          value: aHVudGVyMg==
