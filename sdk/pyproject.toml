[project]
name = "radicalbit-ai-gateway-sdk"
dynamic = ["version"]
description = "Python SDK for the management API of the Radicalbit AI Gateway."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    # httpx2: the maintained fork of httpx (Pydantic org); same API
    "httpx2>=2.16",
    "pydantic>=2.10",
    # TypeAliasType of the Literal type aliases in models.py (Python 3.11)
    "typing-extensions>=4.12",
]

[dependency-groups]
dev = [
    # scripts/generate.sh: the models, and the template of the client methods
    "datamodel-code-generator==0.93.0",
    "jinja2==3.1.6",
    "pytest>=9.0.2",
    "ruff==0.16.6",
    # Type checker: the generated hints are what users' editors rely on (py.typed)
    "ty==0.0.101",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# Same version as the gateway: both read the release tag (vX.Y.Z) of this
# repository, so SDK X.Y.Z is the one generated from gateway X.Y.Z.
[tool.hatch.version]
source = "vcs"
raw-options = { root = ".." }

[tool.hatch.build.targets.wheel]
packages = ["src/radicalbit_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/test_generator.py imports generator/generate_client.py
pythonpath = ["generator"]

# The models (src/radicalbit_gateway/models.py), run by scripts/generate.sh
[tool.datamodel-codegen]
input = "openapi.json"
input-file-type = "openapi"
output = "src/radicalbit_gateway/models.py"
output-model-type = "pydantic_v2.BaseModel"
target-python-version = "3.11"
snake-case-field = true
allow-population-by-field-name = true
use-union-operator = true
use-standard-collections = true
use-schema-description = true
use-field-description = true
# A closed set of values is a Literal type alias, not an Enum class: callers
# pass and compare plain strings (filter='prod'), as in the OpenAI and
# Anthropic SDKs, and the editor still completes them
enum-field-as-literal = "all"
use-type-alias = true
# Tolerates values and fields added by newer gateways (see _models.py)
base-class = "radicalbit_gateway._models.GatewayModel"
field-constraints = true
output-datetime-class = "datetime"
disable-timestamp = true
# The "Code generated ... DO NOT EDIT." convention: editors, linters and code
# review tools recognize the file as generated
custom-file-header = """# Code generated by the Radicalbit AI Gateway SDK generator. DO NOT EDIT.
# Source: sdk/openapi.json. Regenerate: sdk/scripts/generate.sh.
#
# The models of the API, written by datamodel-codegen with the options in
# sdk/pyproject.toml [tool.datamodel-codegen]. Change the gateway's routes or
# those options, then run sdk/scripts/generate.sh."""
formatters = ["builtin"]

[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP", "SIM", "RET"]
ignore = ["E501"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
known-first-party = ["generate_client", "radicalbit_gateway"]
