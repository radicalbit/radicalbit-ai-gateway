# ─────────────────────────────────────────────
# CHAT MODELS
# ─────────────────────────────────────────────
chat_models:
  - model_id: gpt-4o
    model: openai/gpt-4o
    credentials:
      api_key: !secret OPENAI_API_KEY
    params:
      temperature: 0.7
      max_tokens: 1000
    input_cost_per_million_tokens: 2.50
    output_cost_per_million_tokens: 10.00

# ─────────────────────────────────────────────
# GUARDRAILS
# ─────────────────────────────────────────────
guardrails:
  # Local spaCy-based PII redaction (default backend)
  - name: redact-pii-local
    type: presidio_anonymizer
    description: Redact common PII (emails, phones, IBANs, credit cards) using local spaCy engine
    where: input
    behavior: block
    parameters:
      language: en
      entities:
        - EMAIL_ADDRESS
        - PHONE_NUMBER
        - IBAN_CODE
        - CREDIT_CARD

  # Azure Health Data Services PHI redaction
  - name: redact-phi-ahds
    type: presidio_anonymizer
    description: Redact PHI (patients, doctors, dates) via Azure Health Data Services de-identification
    where: input
    behavior: block
    parameters:
      language: en
      entities:
        - PATIENT
        - DOCTOR
        - DATE
      backend: ahds

# ─────────────────────────────────────────────
# ROUTES
# ─────────────────────────────────────────────
routes:
  openai-with-phi:
    chat_models:
      - gpt-4o
    guardrails:
      - redact-pii-local
      - redact-phi-ahds
